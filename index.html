<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Shift Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<style>
/* ── TOKENS ───────────────────────────────────────────────────── */
:root {
  --bg:         #0c1322;
  --bg-dot:     rgba(99,179,237,.08);
  --card-bg:    rgba(14,26,60,.78);
  --card-border:rgba(255,255,255,.09);
  --card-inset: rgba(255,255,255,.05);
  --card-shadow:0 8px 30px rgba(0,0,0,.45);
  --hdr-bg:     rgba(255,255,255,.04);
  --hdr-border: rgba(255,255,255,.08);
  --row-bg:     rgba(255,255,255,.9);
  --row-border: rgba(0,0,0,.04);
  --row-name:   #0f172a;
  --row-role:   #64748b;
  --lv-bg:      rgba(255,255,255,.75);
  --lv-name:    #334155;
  --lv-role:    #94a3b8;
  --txt:        #e2e8f0;
  --txt2:       #94a3b8;
  --txt3:       #475569;
  --badge-bg:   rgba(255,255,255,.08);
  --badge-bdr:  rgba(255,255,255,.12);
  --empty:      rgba(255,255,255,.2);
  --footer-bdr: rgba(255,255,255,.07);
  --topbar-bg:  linear-gradient(90deg,rgba(8,18,55,.98),rgba(18,45,130,.94));
  --topbar-bdr: rgba(99,179,237,.18);
  --stat-bg:    rgba(255,255,255,.1);
  --stat-bdr:   rgba(255,255,255,.15);
  --stat-lbl:   rgba(255,255,255,.7);
  --btn-bg:     rgba(255,255,255,.1);
  --btn-bdr:    rgba(255,255,255,.2);
  --btn-txt:    #e0f2fe;
}
[data-theme="light"] {
  --bg:         #eef2f9;
  --bg-dot:     rgba(59,130,246,.05);
  --card-bg:    rgba(255,255,255,.97);
  --card-border:rgba(0,0,0,.08);
  --card-inset: rgba(255,255,255,.6);
  --card-shadow:0 2px 14px rgba(0,0,0,.09);
  --hdr-bg:     rgba(0,0,0,.025);
  --hdr-border: rgba(0,0,0,.07);
  --row-bg:     #f8fafc;
  --row-border: rgba(0,0,0,.07);
  --row-name:   #0f172a;
  --row-role:   #64748b;
  --lv-bg:      #f1f5f9;
  --lv-name:    #334155;
  --lv-role:    #94a3b8;
  --txt:        #0f172a;
  --txt2:       #475569;
  --txt3:       #94a3b8;
  --badge-bg:   rgba(0,0,0,.05);
  --badge-bdr:  rgba(0,0,0,.1);
  --empty:      #cbd5e1;
  --footer-bdr: rgba(0,0,0,.08);
  --topbar-bg:  linear-gradient(90deg,#1a3a8a,#2563eb);
  --topbar-bdr: rgba(255,255,255,.12);
  --stat-bg:    rgba(255,255,255,.18);
  --stat-bdr:   rgba(255,255,255,.22);
  --stat-lbl:   rgba(255,255,255,.8);
  --btn-bg:     rgba(255,255,255,.15);
  --btn-bdr:    rgba(255,255,255,.25);
  --btn-txt:    #fff;
}

/* ── RESET ────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);min-height:100vh;
  position:relative;color:var(--txt);
  transition:background .25s,color .25s;
}
body::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,var(--bg-dot) 1px,transparent 1px);
  background-size:32px 32px;
}

/* ── LOADING ──────────────────────────────────────────────────── */
#loading{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(59,130,246,.2);border-top-color:#3b82f6;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--txt3);font-size:13px}

/* ── APP ──────────────────────────────────────────────────────── */
#app{display:none;position:relative;z-index:1}

/* ── TOPBAR ───────────────────────────────────────────────────── */
#topbar{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:var(--topbar-bg);
  border-bottom:1px solid var(--topbar-bdr);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:10;
}
#brand{display:flex;align-items:center;gap:7px;flex-shrink:0}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px #22c55e}50%{opacity:.35;box-shadow:0 0 3px #22c55e}}
#brand span{font-family:'Outfit',sans-serif;font-size:13px;font-weight:900;color:#fff;letter-spacing:3px;text-transform:uppercase}

/* DATE + QUOTE block (center) */
#date-block{flex:1;text-align:center;min-width:0;padding:0 8px}
#day-name{font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:#fff;line-height:1}
#date-str{font-size:10px;color:rgba(255,255,255,.65);margin-top:2px;font-weight:600;letter-spacing:.4px}
#quote-line{
  font-size:13px;font-style:italic;font-weight:500;
  color:rgba(255,255,255,.92);
  margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.1px;
}
#quote-line .q-author{
  font-style:normal;font-weight:700;
  color:#93c5fd;margin-left:5px;
  font-size:11px;letter-spacing:.5px;
  white-space:nowrap;
}

/* STATS */
#stats-row{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stat-chip{
  display:flex;flex-direction:column;align-items:center;
  background:var(--stat-bg);border:1px solid var(--stat-bdr);
  border-radius:8px;padding:3px 7px;min-width:30px;
  backdrop-filter:blur(6px);
}
.stat-chip .n{font-family:'Outfit',sans-serif;font-size:14px;font-weight:900;line-height:1;text-shadow:0 0 10px currentColor}
.stat-chip .l{font-size:8px;font-weight:700;margin-top:1px;color:var(--stat-lbl)}

/* ACTIONS */
#actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.t-btn{
  height:30px;background:var(--btn-bg);color:var(--btn-txt);
  border:1px solid var(--btn-bdr);border-radius:7px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
  transition:background .15s,opacity .15s;white-space:nowrap;
}
.t-btn:hover:not(:disabled){background:rgba(255,255,255,.22)}
.t-btn:disabled{opacity:.4;cursor:default}
#copy-btn{padding:0 11px}
#refresh-btn,#theme-btn{width:30px;font-size:14px}
#status-msg{font-size:10px;color:rgba(255,255,255,.7);white-space:nowrap}

/* ── MAIN GRID (3 cols only, no more 4th col) ─────────────────── */
#main{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 10px 0}

/* ── SHIFT CARD ───────────────────────────────────────────────── */
.shift-card{
  border-radius:14px;overflow:hidden;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--card-shadow),inset 0 1px 0 var(--card-inset);
  display:flex;flex-direction:column;
}
.card-hdr{
  padding:10px 14px;display:flex;align-items:center;gap:8px;
  background:var(--hdr-bg);border-bottom:1px solid var(--hdr-border);position:relative;
}
.hdr-accent{position:absolute;left:0;top:0;bottom:0;width:4px}
.hdr-lbl{font-family:'Outfit',sans-serif;font-size:20px;font-weight:900;color:var(--txt);letter-spacing:1px;margin-left:6px}
.hdr-sub{font-size:10px;font-weight:600;color:var(--txt2)}
.hdr-time{font-size:9px;color:var(--txt3);margin-left:auto;text-align:right;line-height:1.5}
.hdr-tz{font-size:8px;color:var(--txt3);opacity:.7}
.hdr-cnt{
  background:var(--badge-bg);border:1px solid var(--badge-bdr);
  border-radius:999px;padding:2px 10px;
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:900;color:var(--txt);flex-shrink:0;
}
.card-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}

/* ── PERSON ROW ───────────────────────────────────────────────── */
.p-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;border-radius:9px;
  background:var(--row-bg);border:1px solid var(--row-border);
}
.p-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e;flex-shrink:0}
.p-av{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:900;flex-shrink:0;
}
.p-name{font-size:17px;font-weight:800;color:var(--row-name);flex:1}
.p-role{font-size:11px;font-weight:600;color:var(--row-role);white-space:nowrap}
.p-badge{padding:2px 7px;border-radius:5px;border-width:1px;border-style:solid;font-size:10px;font-weight:800}
.empty-row{font-size:11px;color:var(--empty);padding:8px 0;text-align:center}

/* ── OFF ROW (horizontal, full width, below grid) ─────────────── */
#off-row{
  margin:10px 10px 0;
  border-radius:14px;overflow:hidden;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--card-shadow),inset 0 1px 0 var(--card-inset);
}
#off-row .card-hdr{
  padding:9px 14px;display:flex;align-items:center;gap:8px;
  background:var(--hdr-bg);border-bottom:1px solid var(--hdr-border);position:relative;
}
#off-chips{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:10px 12px 12px;
}
.l-chip{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:9px;
  background:var(--lv-bg);border:1px solid var(--card-border);
  min-width:0;
}
.l-av{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit',sans-serif;font-size:8px;font-weight:900;flex-shrink:0;opacity:.75;
}
.l-name{font-size:13px;font-weight:700;color:var(--lv-name);white-space:nowrap}
.l-pill{font-size:9px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.3px;flex-shrink:0}

/* ── FOOTER ───────────────────────────────────────────────────── */
#footer{display:none}

/* ── DESKTOP ──────────────────────────────────────────────────── */
@media(min-width:900px){
  #topbar{padding:10px 22px;gap:10px}
  #brand span{font-size:15px}
  #day-name{font-size:26px}
  #date-str{font-size:11px}
  #quote-line{font-size:14px;margin-top:4px}
  #quote-line .q-author{font-size:12px}
  .stat-chip{padding:4px 10px;min-width:42px;border-radius:9px}
  .stat-chip .n{font-size:17px}
  .stat-chip .l{font-size:9px}
  #stats-row{gap:5px}
  .t-btn{height:34px}
  #copy-btn{padding:0 15px;font-size:12px}
  #refresh-btn,#theme-btn{width:34px;font-size:15px}
  #status-msg{font-size:11px}

  #main{grid-template-columns:1fr 1fr 1fr;gap:12px;padding:14px 20px 0}

  .shift-card{border-radius:16px}
  .card-hdr{padding:12px 16px}
  .hdr-lbl{font-size:22px;margin-left:8px}
  .hdr-sub{font-size:11px}
  .hdr-time{font-size:10px}
  .hdr-tz{font-size:9px}
  .hdr-cnt{font-size:14px;padding:3px 12px}
  .card-body{padding:10px 12px 12px;gap:5px}

  .p-row{padding:8px 14px;border-radius:10px;gap:11px}
  .p-av{width:36px;height:36px;font-size:11px}
  .p-dot{width:7px;height:7px}
  .p-name{font-size:19px}
  .p-role{font-size:11px}
  .p-badge{font-size:10px}

  #off-row{margin:12px 20px 0;border-radius:16px}
  #off-row .card-hdr{padding:10px 18px}
  #off-chips{gap:7px;padding:12px 16px 14px}
  .l-chip{padding:6px 12px;border-radius:10px;gap:7px}
  .l-av{width:26px;height:26px;font-size:9px}
  .l-name{font-size:14px}
  .l-pill{font-size:10px;padding:2px 9px}

}

@media(min-width:1200px){
  #day-name{font-size:30px}
  #date-str{font-size:12px}
  #quote-line{font-size:15px}
  #quote-line .q-author{font-size:13px}
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Đang tải dữ liệu…</p>
</div>

<div id="app">
  <div id="topbar">
    <div id="brand">
      <div class="live-dot"></div>
      <span>Tech Support</span>
    </div>
    <div id="date-block">
      <div id="day-name"></div>
      <div id="date-str"></div>
      <div id="quote-line"></div>
    </div>
    <div id="stats-row"></div>
    <div id="actions">
      <button id="copy-btn" class="t-btn" onclick="copyImg()">📋 Copy</button>
      <button id="refresh-btn" class="t-btn" onclick="loadData()" title="Refresh">↻</button>
      <button id="theme-btn" class="t-btn" onclick="toggleTheme()" title="Đổi theme">🌙</button>
      <span id="status-msg"></span>
    </div>
  </div>
  <div id="main"></div>
  <div id="off-row" style="display:none">
    <div class="card-hdr">
      <div class="hdr-accent" style="background:#64748b"></div>
      <span class="hdr-lbl" style="font-size:15px;letter-spacing:1.5px;margin-left:6px;">OFF</span>
      <span class="hdr-sub">Vắng mặt</span>
      <span class="hdr-cnt" id="off-cnt">0</span>
    </div>
    <div id="off-chips"></div>
  </div>
  <div id="footer"></div>
</div>

<script>
/* ── THEME ─────────────────────────────────────────────────────── */
(function(){
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch(e){}
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = document.documentElement.getAttribute("data-theme") === "light" ? "☀️" : "🌙";
})();

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  document.getElementById("theme-btn").textContent = next === "dark" ? "🌙" : "☀️";
  try { localStorage.setItem("theme", next); } catch(e){}
}

/* ── CONFIG ────────────────────────────────────────────────────── */
const SP_URL     = "https://lichtech.quang-vo.workers.dev";
const FILTER_TAB = "Filter";
const WORK       = { C1:1, C2:1, C3:1 };
const LEAVE      = { OFF:1, ME:1, NP:1, HO:1 };

const SHIFT_META = {
  C1:{ accent:"#3b82f6", avBg:"#dbeafe", avTxt:"#1d4ed8" },
  C2:{ accent:"#f97316", avBg:"#ffedd5", avTxt:"#b45309" },
  C3:{ accent:"#22c55e", avBg:"#dcfce7", avTxt:"#15803d" },
};
const LEAVE_META = {
  OFF:{ avBg:"#e2e8f0", avTxt:"#475569", pillBg:"#e2e8f0", pillTxt:"#475569" },
  ME: { avBg:"#dbeafe", avTxt:"#1d4ed8", pillBg:"#dbeafe", pillTxt:"#1d4ed8" },

};
const STAT_CFG = [

  { key:"C1",    lbl:"C1",    clr:"#60a5fa" },
  { key:"C2",    lbl:"C2",    clr:"#fb923c" },

  { key:"OFF",   lbl:"OFF",   clr:"#94a3b8" },

];
const QUOTES = [
  ["The only way to do great work is to love what you do.","Steve Jobs"],
  ["Success is not final, failure is not fatal: it is the courage to continue that counts.","Winston Churchill"],
  ["Believe you can and you're halfway there.","Theodore Roosevelt"],

  ["Don't watch the clock; do what it does. Keep going.","Sam Levenson"],
  ["Great things never come from comfort zones.","Unknown"],
  ["Push yourself, because no one else is going to do it for you.","Unknown"],
  ["Dream it. Wish it. Do it.","Unknown"],
  ["Success doesn't just find you. You have to go out and get it.","Unknown"],
  ["The harder you work for something, the greater you'll feel when you achieve it.","Unknown"],

  ["Don't stop when you're tired. Stop when you're done.","Unknown"],
  ["Wake up with determination. Go to bed with satisfaction.","Unknown"],
  ["Do something today that your future self will thank you for.","Sean Patrick Flanery"],

  ["Trust because you are willing to accept the risk, not because it's safe or certain.","Unknown"],
  ["Take up one idea. Make that one idea your life.","Swami Vivekananda"],
  ["All our dreams can come true if we have the courage to pursue them.","Walt Disney"],
  ["Good things come to people who wait, but better things come to those who go out and get them.","Unknown"],

/* ── DATE (US Central) ─────────────────────────────────────────── */
const _now = new Date();
const _tz  = "America/Chicago";
const _fmt = o => _now.toLocaleDateString("en-US", { timeZone:_tz, ...o });
const DAY_NAME = _fmt({ weekday:"long" });
const DATE_STR = _fmt({ year:"numeric", month:"long", day:"2-digit" });
const _Y = +_fmt({ year:"numeric" });
const _M = +_fmt({ month:"numeric" });
const _D = +_fmt({ day:"numeric" });

function centralOffset(y, m, d) {
  function nthSun(yr, mo, n) {
    const dow = new Date(yr, mo - 1, 1).getDay();
    return 1 + (7 - dow) % 7 + (n - 1) * 7;
  }
  let dst;
  if (m < 3 || m > 11)      dst = false;
  else if (m > 3 && m < 11) dst = true;
  else if (m === 3)         dst = d >= nthSun(y, 3, 2);
  else                      dst = d <  nthSun(y, 11, 1);
  return dst ? { off:-5, lbl:"CDT (UTC−5)" } : { off:-6, lbl:"CST (UTC−6)" };
}
const _ct    = centralOffset(_Y, _M, _D);
const TZ_LBL = _ct.lbl;
const LOC_OFF = _ct.off;
const DAY_OF_YR = Math.ceil((new Date(_Y,_M-1,_D) - new Date(_Y,0,0)) / 86400000);

function vnToLocal(h) { return ((h - 7 + LOC_OFF) % 24 + 24) % 24; }
function fmtH(h) {
  const ap = h < 12 ? "AM" : "PM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ":00 " + ap;
}
const SH_TIMES = {
  C1: fmtH(vnToLocal(20)) + " – " + fmtH(vnToLocal(4)),
  C2: fmtH(vnToLocal(4))  + " – " + fmtH(vnToLocal(12)),
  C3: fmtH(vnToLocal(22)) + " – " + fmtH(vnToLocal(5)),
};

/* ── HELPERS ───────────────────────────────────────────────────── */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":'&#39;'})[c]);
}
function cleanName(n) { return n.replace(/\s*\([^)]*\)/g,"").trim(); }
function cleanRole(r) { return (r||"").trim().replace(/[,;.]+$/,"").trim(); }
function initials(n) { return cleanName(n).split(/\s+/).filter(w=>w).slice(-2).map(w=>w[0].toUpperCase()).join("")||"?"; }
function roleStyle(r) {
  const l = r.toLowerCase();
  if (l.includes("mgr"))                             return "background:#fef3c7;color:#92400e;border:1px solid #fcd34d;font-weight:800;";
  if (l.includes("supr")||l.includes("supervisor"))  return "background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd;font-weight:800;";
  return "";
}

/* ── RENDER ────────────────────────────────────────────────────── */
function personRow(p, m) {
  const ini  = esc(initials(p.name));
  const name = esc(cleanName(p.name));
  const rr   = cleanRole(p.role);
  const rs   = roleStyle(rr);
  const role = esc(rr);
  const rHtml = role ? `<span class="p-role${rs?" p-badge":""}" style="${rs}">${role}</span>` : "";
  return `<div class="p-row">
    <span class="p-dot"></span>
    <div class="p-av" style="background:${m.avBg};color:${m.avTxt};">${ini}</div>
    <span class="p-name">${name}</span>${rHtml}
  </div>`;
}

function leaveChip(p) {
  const lm  = LEAVE_META[p.st]||LEAVE_META.OFF;
  const ini = esc(initials(p.name));
  const nm  = esc(cleanName(p.name));
  return `<div class="l-chip">
    <div class="l-av" style="background:${lm.avBg};color:${lm.avTxt};">${ini}</div>
    <span class="l-name">${nm}</span>
    <span class="l-pill" style="background:${lm.pillBg};color:${lm.pillTxt};">${esc(p.st)}</span>
  </div>`;
}

function shiftCard(s, grouped) {
  const people = grouped[s]||[];
  const m = SHIFT_META[s];
  const idAttr = s==="C2" ? ' id="card-c2"' : s==="C3" ? ' id="card-c3"' : '';
  const body = people.length ? people.map(p=>personRow(p,m)).join("") : '<div class="empty-row">—</div>';
  return `<div class="shift-card"${idAttr}>
    <div class="card-hdr">
      <div class="hdr-accent" style="background:${m.accent}"></div>
      <span class="hdr-lbl">${s}</span>
      <span class="hdr-sub">Shift ${s.slice(1)}</span>
      <span class="hdr-time">${SH_TIMES[s]}<br><span class="hdr-tz">${TZ_LBL}</span></span>
      <span class="hdr-cnt">${people.length}</span>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

function render(grouped) {
  // Date
  document.getElementById("day-name").textContent = DAY_NAME;
  document.getElementById("date-str").textContent = DATE_STR;

  // Quote in topbar
  const q = QUOTES[DAY_OF_YR % QUOTES.length];
  const ql = document.getElementById("quote-line");
  ql.innerHTML = `<em>${esc(q[0])}</em><span class="q-author">— ${esc(q[1])}</span>`;

  // Stats
  const wc  = { C1:grouped.C1.length, C2:grouped.C2.length, C3:grouped.C3.length };
  const lc  = { ME:0, NP:0, HO:0, OFF:0 };
  (grouped.OTHER||[]).forEach(p => { if (p.st in lc) lc[p.st]++; });
  const working = wc.C1 + wc.C2 + wc.C3;
  const total   = working + lc.ME + lc.NP + lc.HO + lc.OFF;
  const counts  = { ...wc, ...lc, work:working, total };

  document.getElementById("stats-row").innerHTML = STAT_CFG.map(s =>
    `<div class="stat-chip">
      <span class="n" style="color:${s.clr};">${counts[s.key]||0}</span>
      <span class="l">${s.lbl}</span>
    </div>`
  ).join("");

  // Update theme btn
  const tBtn = document.getElementById("theme-btn");
  if (tBtn) tBtn.textContent = document.documentElement.getAttribute("data-theme") === "light" ? "☀️" : "🌙";

  // Shift cards (3 col, no OFF)
  const main = document.getElementById("main");
  main.innerHTML = shiftCard("C1",grouped) + shiftCard("C3",grouped) + shiftCard("C2",grouped);

  // OFF horizontal row
  const offPeople = grouped.OTHER||[];
  const offRow = document.getElementById("off-row");
  if (offPeople.length) {
    document.getElementById("off-cnt").textContent = offPeople.length;
    document.getElementById("off-chips").innerHTML = offPeople.map(leaveChip).join("");
    offRow.style.display = "block";
  } else {
    offRow.style.display = "none";
  }

  // Footer
  document.getElementById("footer").innerHTML =
    `Shift 1: ${SH_TIMES.C1} &nbsp;·&nbsp; Shift 2: ${SH_TIMES.C2} &nbsp;·&nbsp; Shift 3: ${SH_TIMES.C3} &nbsp;·&nbsp; All times <strong>${TZ_LBL}</strong> &nbsp;·&nbsp; TECH TEAM`;

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
}

/* ── FETCH ─────────────────────────────────────────────────────── */
async function loadData() {
  const loadEl = document.getElementById("loading");
  const appEl  = document.getElementById("app");
  loadEl.innerHTML = '<div class="spinner"></div><p>Đang tải dữ liệu…</p>';
  loadEl.style.display = "flex";
  appEl.style.display  = "none";

  try {
    const resp = await fetch(SP_URL);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const buf  = await resp.arrayBuffer();
    const wb   = XLSX.read(buf, { type:"array" });
    const ws   = wb.Sheets[FILTER_TAB];
    if (!ws) throw new Error(`Tab "${FILTER_TAB}" không tìm thấy`);

    const rows    = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
    const grouped = { C1:[], C2:[], C3:[], OTHER:[] };
    const norm    = v => String(v||"").trim().toUpperCase();

    for (let i = 2; i < rows.length; i++) {
      const row    = rows[i];
      const name   = String(row[1]||"").trim();
      const role   = String(row[2]||"").trim();
      const status = norm(row[3]);
      if (!name || /[0-9:\/]/.test(name)) continue;
      if (WORK[status])       grouped[status].push({ name, role });
      else if (LEAVE[status]) grouped.OTHER.push({ name, role, st:status });
    }
    render(grouped);
  } catch(err) {
    loadEl.innerHTML = `
      <div style="text-align:center;padding:24px;max-width:440px">
        <div style="font-size:36px;margin-bottom:14px">⚠️</div>
        <div style="color:#f87171;font-size:15px;font-weight:700;margin-bottom:8px">Không thể tải dữ liệu</div>
        <div style="color:#64748b;font-size:13px;line-height:1.7;margin-bottom:16px">${esc(err.message)}</div>
        <button onclick="loadData()" style="padding:7px 18px;background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3);border-radius:7px;font-size:12px;font-weight:700;cursor:pointer">↻ Thử lại</button>
      </div>`;
  }
}

/* ── COPY ──────────────────────────────────────────────────────── */
function copyImg() {
  const btn = document.getElementById("copy-btn");
  const msg = document.getElementById("status-msg");
  if (!btn) return;
  btn.disabled = true; btn.textContent = "⏳ Đang tạo…";
  msg.textContent = "";

  const reset = () => { btn.disabled = false; btn.textContent = "📋 Copy"; };
  const flash = (t, ms) => { msg.textContent = t; setTimeout(()=>msg.textContent="", ms||4000); };
  const dl    = c => { const a=document.createElement("a"); a.href=c.toDataURL("image/png"); a.download="tech-shift.png"; a.click(); };

  const glassEls = [...document.querySelectorAll(".shift-card,.stat-chip,#off-row")];
  glassEls.forEach(el => { el.style.backdropFilter="none"; el.style.webkitBackdropFilter="none"; });
  const restore = () => glassEls.forEach(el => { el.style.backdropFilter=""; el.style.webkitBackdropFilter=""; });

  (document.fonts&&document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(() => {
      const W = document.body.scrollWidth;
      const H = document.body.scrollHeight;
      const scale = Math.max(1.25, Math.min(2, 1920/W));
      const bg = document.documentElement.getAttribute("data-theme") === "light" ? "#eef2f9" : "#0c1322";
      return html2canvas(document.body, {
        scale, useCORS:true, backgroundColor:bg,
        logging:false, imageTimeout:0, windowWidth:W, windowHeight:H
      });
    })
    .then(canvas => {
      restore();
      canvas.toBlob(blob => {
        if (!blob) { reset(); flash("❌ Không tạo được ảnh"); return; }
        const ok = navigator.clipboard && window.ClipboardItem;
        if (!ok) { dl(canvas); reset(); flash("⚠️ Đã tải xuống (trình duyệt không hỗ trợ copy)"); return; }
        navigator.clipboard.write([new ClipboardItem({"image/png":blob})])
          .then(() => { reset(); flash("✅ Đã copy! Paste vào Telegram."); })
          .catch(() => { dl(canvas); reset(); flash("⚠️ Clipboard bị chặn, đã tải xuống"); });
      }, "image/png");
    })
    .catch(err => { restore(); reset(); flash("❌ Lỗi: "+(err&&err.message||err), 6000); });
}

loadData();
</script>
